<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#059669">
    <title>Sin conexión</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f1f5f9; color: #1e293b; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
        .card { max-width: 380px; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px 24px; box-shadow: 0 4px 16px rgba(15, 23, 42, .06); }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { font-size: 14px; color: #64748b; margin: 0 0 20px; line-height: 1.5; }
        button { background: #059669; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sin conexión a internet</h1>
        <p>No pudimos conectar con el sistema. Revisa tu conexión y vuelve a intentarlo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
